name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -el {0}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda-forge environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-dev.yaml
          create-args: python=${{ matrix.python-version }}
          cache-environment: true

      - name: Install package
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Run tests
        run: pytest -v

      - name: Invoke CLI
        run: |
          forge-tools --version
          forge-tools --help
          forge-tools greet World --times 2
          forge-tools stats 1 2 3 4 --op mean
          forge-tools wordcount README.md
          echo "piped input text" | forge-tools wordcount --words
          python -m forge_tools greet "python -m"
