[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-tools"
version = "0.1.0"
description = "A collection of small command line tools."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{ name = "Thorsten Beier", email = "thorsten.beier@quantstack.net" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["py-rattler-build"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
forge-tools = "forge_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
